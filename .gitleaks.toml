title = "daily-mud-fluid-report gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholder values that are meant to be committed"
paths = [
  '''(^|/)\.env\.example$''',
]
# Made-up secrets that only tests use (env.ts requires a JWT_SECRET of 32+ characters).
# Listed one by one, not by path, so a real secret pasted into a test file is still caught.
regexes = [
  '''a-test-secret-that-is-long-enough-for-hs256''',
  '''test-only-jwt-secret-that-is-long-enough''',
]
